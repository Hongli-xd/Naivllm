[project]
name = "myvllm"
version = "0.1.0"
description = "A custom vLLM project"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "transformers",
    "torch",
    "xxhash",
    "vllm>=0.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "matplotlib",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.8",
    "matplotlib>=3.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"
